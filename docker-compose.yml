services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: financial-anomaly-kafka
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/tmp/kafka-logs
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:19092,CONTROLLER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-ui:
    image: kafbat/kafka-ui@sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1
    container_name: financial-anomaly-kafka-ui
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"

  kafka-volume-init:
    image: apache/kafka:3.9.0
    user: "0:0"
    volumes:
      - kafka-data:/tmp/kafka-logs
    entrypoint: ["/bin/bash", "-c"]
    command:
      - chown -R 1000:1000 /tmp/kafka-logs

  mongo:
    image: mongo:7
    container_name: financial-anomaly-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for topic in transactions.raw transactions.scored transactions.anomalies transactions.dlq; do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:19092 \
            --create \
            --if-not-exists \
            --topic "$$topic" \
            --partitions 1 \
            --replication-factor 1

          description=$$(/opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:19092 \
            --describe \
            --topic "$$topic")
          partition_count=$$(printf '%s\n' "$$description" | sed -n 's/.*PartitionCount: \([0-9][0-9]*\).*/\1/p')
          replication_factor=$$(printf '%s\n' "$$description" | sed -n 's/.*ReplicationFactor: \([0-9][0-9]*\).*/\1/p')
          if [ "$$partition_count" != "1" ] || [ "$$replication_factor" != "1" ]; then
            echo "topic $$topic has unexpected partitions/replication: $$description" >&2
            exit 1
          fi
        done

volumes:
  kafka-data:
  mongo-data:
